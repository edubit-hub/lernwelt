<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>Lernwelt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F3EFE6">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernwelt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  /* Nur das Nötigste für Wächter und Ladezustand. Die Gestaltung der App lädt der Lader aus app/stil (AP-04). */
  html { color-scheme: light; background: #F3EFE6; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #F3EFE6; color: #1E2A34;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #waechter { box-sizing: border-box; max-width: 36rem; margin: 3rem auto; padding: 1.25rem 1.5rem;
              background: #FFFFFF; border: 1px solid #C7CDD3; border-left: 4px solid #B5483A; border-radius: 8px; }
  #waechter[hidden] { display: none; }
  #waechter h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
  #waechter p, #waechter ul { margin: .5rem 0; }
  #waechter ul { padding-left: 1.25rem; color: #5B6B78; font-size: .875rem; word-break: break-word; }
</style>
<script>
/* Wächter. Bewusst in alter Syntax (var, function), damit auch ein veralteter Safari ihn lesen kann.
   Wenn Lernwelt.gestartet nach 3 Sekunden fehlt, erscheint eine lesbare Meldung statt einer weissen Seite. */
(function () {
  var probleme = [];
  function merke(text) { if (probleme.length < 6 && text) { probleme.push(String(text)); } }
  window.addEventListener('error', function (e) {
    var ziel = e.target;
    if (ziel && ziel !== window && (ziel.src || ziel.href)) { merke('Datei fehlt: ' + (ziel.getAttribute('src') || ziel.getAttribute('href'))); }
    else { merke((e.message || 'Fehler') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : '')); }
  }, true);
  function gestartet() { return !!(window.Lernwelt && window.Lernwelt.gestartet); }
  function zeige() {
    var kasten = document.getElementById('waechter');
    if (!kasten) { return; }
    var liste = document.getElementById('waechter-liste');
    var lader = window.Lernwelt && window.Lernwelt.Lader && window.Lernwelt.Lader.fehler ? window.Lernwelt.Lader.fehler : [];
    var alle = probleme.slice(), i;
    for (i = 0; i < lader.length && alle.length < 8; i++) { alle.push('Datei fehlt: ' + lader[i].datei); }
    while (liste.firstChild) { liste.removeChild(liste.firstChild); }
    for (i = 0; i < alle.length; i++) { var punkt = document.createElement('li'); punkt.appendChild(document.createTextNode(alle[i])); liste.appendChild(punkt); }
    kasten.hidden = false;
    var beobachter = setInterval(function () { if (gestartet()) { kasten.hidden = true; clearInterval(beobachter); } }, 500);
  }
  setTimeout(function () { if (!gestartet()) { zeige(); } }, 3000);
})();
</script>
</head>
<body>
<div id="app"></div>
<div id="waechter" role="alert" hidden>
  <h1>Die Lernwelt konnte nicht starten</h1>
  <p>Möglicherweise ist die Version von Safari zu alt. Bitte iPadOS und Safari aktualisieren und die App danach neu öffnen.</p>
  <p>Wenn es weiterhin nicht klappt, helfen diese Angaben bei der Suche:</p>
  <ul id="waechter-liste"></ul>
</div>
<noscript><p style="padding:1.5rem">Die Lernwelt braucht JavaScript. Bitte JavaScript in den Einstellungen des Browsers einschalten.</p></noscript>
<script src="version.js"></script>
<script src="app/manifest.js"></script>
<script src="app/kern/registry.js"></script>
<script src="app/kern/lader.js"></script>
<script src="app/start.js"></script>
</body>
</html>
