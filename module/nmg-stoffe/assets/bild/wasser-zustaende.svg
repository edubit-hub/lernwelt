<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 480 220" width="640" height="293">
<!-- Wasser in drei Zuständen: Eis, Wasser im Glas, Dampf über dem Topf. Pfeile oben: Wärme zugeführt (warm), unten: abgekühlt. Keine Schrift im Bild, die Beschriftung macht das Kind.
     data-teil und data-box (x y Breite Höhe im viewBox) nennen, was die Punkte in modul.js treffen müssen. test.js liest sie. -->
<rect width="480" height="360" fill="#FFFFFF"/>
