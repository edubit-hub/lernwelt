<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="640" height="480">
<!-- Filtrieren: Sandwasser wird aus einem Becher in einen Trichter mit Filterpapier gegossen, unten läuft sauberes Wasser in ein Glas. Keine Schrift im Bild.
     data-teil und data-box (x y Breite Höhe im viewBox) nennen, was die Punkte in modul.js treffen müssen. test.js liest sie. -->
<defs>
  <clipPath id="becherform"><rect x="-32" y="-42" width="64" height="84" rx="6" transform="translate(110 96) rotate(40)"/></clipPath>
</defs>
<rect width="480" height="360" fill="#FFFFFF"/>
<g data-teil="becher" data-box="58 43 104 106">
  <rect x="-32" y="-42" width="64" height="84" rx="6" fill="#F3F6F7" transform="translate(110 96) rotate(40)"/>
  <rect x="60" y="88" width="130" height="100" fill="#CDB784" clip-path="url(#becherform)"/>
  <rect x="-32" y="-42" width="64" height="84" rx="6" fill="none" stroke="#5B6B78" stroke-width="3" transform="translate(110 96) rotate(40)"/>
  <path d="M162 88 C 170 104 192 112 208 128" stroke="#CDB784" stroke-width="6" stroke-linecap="round" fill="none"/>
</g>
<g data-teil="trichter" data-box="160 130 160 136">
  <path d="M160 130 L320 130 L247 232 L247 266 L233 266 L233 232 Z" fill="#EEF2F4" stroke="#5B6B78" stroke-width="3" stroke-linejoin="round"/>
</g>
<g data-teil="filter" data-box="176 132 128 86">
  <polygon points="176,132 304,132 247,218 233,218" fill="#FBF4DC" stroke="#CDBA86" stroke-width="2.500" stroke-linejoin="round"/>
</g>
<g data-teil="sand" data-box="203 164 75 54">
  <path d="M202.500 174 Q240 164 277.500 174 L247 218 L233 218 Z" fill="#D8BC7A"/>
</g>
<path d="M240 270 C 236 277 236 281 240 281 C 244 281 244 277 240 270 Z" fill="#8DBFCB"/>
<g data-teil="glas" data-box="170 250 140 80">
  <path d="M173.500 292 L306.500 292 L306.500 318 Q306.500 326.500 298 326.500 L182 326.500 Q173.500 326.500 173.500 318 Z" fill="#BFDDE3"/>
  <path d="M170 250 L170 320 Q170 330 180 330 L300 330 Q310 330 310 320 L310 250" fill="none" stroke="#5B6B78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</g>
</svg>
